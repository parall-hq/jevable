name: release

# On every push to main. While changesets are pending, keep the "Version
# Packages" pull request up to date: versions and changelogs. Once it is
# merged, publish every package whose version is not on npm yet, then tag it
# and write its GitHub release. npm trusts this workflow (trusted publishing,
# set up once per package on npmjs.com): no npm token is stored anywhere, and
# every version carries provenance.
on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the version branch, tags and GitHub releases
      pull-requests: write # the Version Packages pull request
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - uses: changesets/action@66d7d1ddafddf1ef45f98ee51a7496f9cdadb2f4 # v2.1.2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          pr-title: "chore: release"
          commit-message: "chore: release"
        env:
          # the changelog links each entry to its pull request through the GitHub API
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
