name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tests run the TypeScript sources directly, which needs Node's type stripping.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The published packages promise Node >= 20.3: run the built CLI there.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node packages/cli/dist/cli.js --version
      - run: printf 'x\ny\n' | node packages/cli/dist/cli.js filter 'line.contains("x")'
